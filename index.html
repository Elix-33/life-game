<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Life Game</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f3ee;--card:#fff;--ink:#1d1b2e;--mut:#6b6880;--pri:#6d4aff;--acc:#ffb020;--line:#e4e0f0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14121f;--card:#1e1b2e;--ink:#f1eefc;--mut:#a29fb8;--line:#332f4a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14121f;--card:#1e1b2e;--ink:#f1eefc;--mut:#a29fb8;--line:#332f4a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;line-height:1.6}
.w{max-width:560px;margin:0 auto;padding:14px}
.hero{background:linear-gradient(135deg,var(--pri),#a34aff);color:#fff;border-radius:20px;padding:16px}
.hero .t{display:flex;justify-content:space-between;font-weight:800;font-size:18px}
.bar{height:12px;background:rgba(255,255,255,.28);border-radius:9px;margin:10px 0 4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:9px;transition:width .4s}
.sub{display:flex;justify-content:space-between;font-size:13px;opacity:.92}
nav{display:flex;gap:6px;margin:14px 0;overflow-x:auto}
nav button{flex:1;padding:9px 6px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;font:inherit;font-weight:700;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.c{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:12px}
h3{margin:0 0 8px;font-size:16px}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.row input[type=checkbox]{width:22px;height:22px;accent-color:var(--pri)}
.row span{flex:1}
.row.done span{text-decoration:line-through;color:var(--mut)}
.row b{color:var(--acc);font-size:13px}
.x{border:0;background:none;color:var(--mut);font-size:16px;cursor:pointer}
.f{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
input[type=text],input[type=password],input[type=time],select,textarea{font:inherit;padding:9px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
input[type=text],input[type=password],textarea{flex:1;min-width:120px}
textarea{width:100%;min-height:70px}
.btn{padding:9px 14px;border:0;border-radius:10px;background:var(--pri);color:#fff;font:inherit;font-weight:700;cursor:pointer}
.btn.g{background:var(--card);color:var(--pri);border:1px solid var(--pri)}
.mut{color:var(--mut);font-size:14px}
.tm{font-weight:800;color:var(--pri);min-width:54px;text-align:left}
.today{border-color:var(--pri)}
#aiout{white-space:pre-wrap;margin-top:10px}
.toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;z-index:20;max-width:90%}
</style>
</head>
<body>
<div class="w">
<div class="hero">
<div class="t"><span id="lv"></span><span id="st"></span></div>
<div class="bar"><i id="bar"></i></div>
<div class="sub"><span id="xp"></span><span>100 XP to next level</span></div>
</div>
<nav id="nav"></nav>
<main id="v"></main>
</div>
<script>
const K='lifegame.v1';
let S={xp:0,streak:0,last:'',goals:[],sched:[],remind:'',theme:{}};
try{const r=localStorage.getItem(K);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const XP={d:10,w:30,m:100},NM={d:'Daily',w:'Weekly',m:'Monthly'};
const DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
function key(p){const d=new Date();if(p==='d')return ymd(d);if(p==='m')return d.getFullYear()+'-'+pad(d.getMonth()+1);const s=new Date(d);s.setDate(d.getDate()-((d.getDay()+1)%7));return ymd(s)}
const isDone=g=>g.done===key(g.p);
let tab='today',aiText='',aiQ='';
const TABS=[['today','Today'],['goals','Goals'],['sched','Schedule'],['ai','AI Coach']];

function head(){
  const lv=Math.floor(S.xp/100)+1;
  $('#lv').textContent='⚔️ Level '+lv;
  $('#st').textContent='🔥 '+S.streak+'-day streak';
  $('#xp').textContent=S.xp+' XP';
  $('#bar').style.width=(S.xp%100)+'%';
}
function goalRow(g){
  const d=isDone(g);
  return '<div class="row '+(d?'done':'')+'"><input type="checkbox" data-t="'+g.id+'" '+(d?'checked':'')+'><span>'+esc(g.t)+'</span><b>+'+XP[g.p]+'</b><button class="x" data-del="'+g.id+'">✕</button></div>';
}
function schedToday(){
  const n=new Date().getDay();
  return S.sched.filter(i=>i.d==='all'||+i.d===n).sort((a,b)=>a.tm.localeCompare(b.tm));
}
function view(){
  let h='';
  if(tab==='today'){
    const sc=schedToday(),dg=S.goals.filter(g=>g.p==='d');
    h+='<div class="c today"><h3>📅 Today’s schedule ('+DAYS[new Date().getDay()]+')</h3>';
    h+=sc.length?sc.map(i=>'<div class="row"><span class="tm">'+esc(i.tm)+'</span><span>'+esc(i.t)+'</span></div>').join(''):'<p class="mut">Nothing scheduled today. Add items in the Schedule tab.</p>';
    h+='</div><div class="c"><h3>🎯 Today’s goals</h3>';
    h+=dg.length?dg.map(goalRow).join(''):'<p class="mut">No daily goals yet. Add some in the Goals tab.</p>';
    h+='</div>';
    ['w','m'].forEach(p=>{const l=S.goals.filter(g=>g.p===p);if(l.length)h+='<div class="c"><h3>'+(p==='w'?'🗓️ Weekly goals':'🏆 Monthly goals')+' — '+l.filter(isDone).length+'/'+l.length+'</h3>'+l.map(goalRow).join('')+'</div>'});
  }else if(tab==='goals'){
    ['d','w','m'].forEach(p=>{const l=S.goals.filter(g=>g.p===p);h+='<div class="c"><h3>'+NM[p]+' goals (+'+XP[p]+' XP)</h3>'+(l.length?l.map(goalRow).join(''):'<p class="mut">Empty</p>')+'</div>'});
    h+='<div class="c"><h3>➕ New goal</h3><div class="f"><input type="text" id="gt" placeholder="e.g. Read 20 pages"><select id="gp"><option value="d">Daily</option><option value="w">Weekly</option><option value="m">Monthly</option></select><button class="btn" data-addg>Add</button></div></div>';
  }else if(tab==='sched'){
    h+='<div class="c"><h3>🔔 Notifications</h3><p class="mut">'+notifState()+'</p><div class="f"><button class="btn" data-notif>Enable notifications</button><button class="btn g" data-test>Test</button></div><div class="f"><span class="mut">Daily goals reminder:</span><input type="time" id="rm" value="'+(S.remind||'')+'"><button class="btn g" data-rm>Save</button></div></div><div class="c"><h3>➕ New schedule item</h3><div class="f"><select id="sd"><option value="all">Every day</option>'+DAYS.map((d,i)=>'<option value="'+i+'">'+d+'</option>').join('')+'</select><input type="time" id="stm" value="09:00"><input type="text" id="stt" placeholder="e.g. Work / Gym / Study"><button class="btn" data-adds>Add</button></div></div>';
    const grp=[['all','Every day']].concat(DAYS.map((d,i)=>[String(i),d]));
    grp.forEach(([k,n])=>{const l=S.sched.filter(i=>String(i.d)===k).sort((a,b)=>a.tm.localeCompare(b.tm));if(l.length)h+='<div class="c"><h3>'+n+'</h3>'+l.map(i=>'<div class="row"><span class="tm">'+esc(i.tm)+'</span><span>'+esc(i.t)+'</span><button class="x" data-dels="'+i.id+'">✕</button></div>').join('')+'</div>'});
  }else{
    h+='<div class="c"><h3>🤖 Your AI coach</h3><p class="mut">Reads your schedule and goals, and can add goals, add schedule items, or change colors. Try: add a daily goal to drink water, or make the app green.</p><div class="f"><button class="btn" data-ai="Plan my day realistically based on my schedule and goals.">Plan my day</button><button class="btn g" data-ai="Review my goals, tell me which to focus on, and break it into small steps.">Review goals</button><button class="btn g" data-ai="Suggest 5 new goals that fit my schedule.">Suggest goals</button></div><div class="f"><textarea id="aq" placeholder="Ask anything...">'+esc(aiQ)+'</textarea><button class="btn" data-ask>Ask</button></div><div id="aiout">'+esc(aiText)+'</div></div>'+(window.claude?'':'<div class="c"><h3>🔑 API key</h3><p class="mut">Your key stays in this browser only. Get a free Gemini key at aistudio.google.com/apikey (free tier has daily limits). Keys starting with sk-ant use Anthropic instead.</p><div class="f"><input type="password" id="ak" placeholder="'+(S.key?'Key saved (paste a new one to replace)':'Paste your API key')+'"><button class="btn" data-key>Save</button><button class="btn g" data-nokey>Remove</button></div></div>');
  }
  $('#v').innerHTML=h;
}
function render(){
  $('#nav').innerHTML=TABS.map(t=>'<button data-tab="'+t[0]+'" class="'+(t[0]===tab?'on':'')+'">'+t[1]+'</button>').join('');
  head();view();
}
function toggle(id){
  const g=S.goals.find(x=>String(x.id)===id);if(!g)return;
  if(isDone(g)){g.done='';S.xp=Math.max(0,S.xp-XP[g.p])}
  else{
    g.done=key(g.p);S.xp+=XP[g.p];
    const t=ymd(new Date());
    if(S.last!==t){const y=new Date();y.setDate(y.getDate()-1);S.streak=S.last===ymd(y)?S.streak+1:1;S.last=t}
  }
  save();render();
}
function applyTheme(){const r=document.documentElement.style;['pri','acc','bg','card','ink'].forEach(k=>{if(S.theme&&S.theme[k])r.setProperty('--'+k,S.theme[k]);else r.removeProperty('--'+k)})}
const nid=()=>Date.now()*1000+Math.floor(Math.random()*1000);
const TOOLS=[
 {name:'add_goal',description:'Add a goal. period: d=daily, w=weekly, m=monthly.',inputSchema:{type:'object',properties:{text:{type:'string'},period:{type:'string',enum:['d','w','m']}},required:['text','period']},execute:async i=>{if(!['d','w','m'].includes(i.period)||!String(i.text||'').trim())throw new Error('bad input');S.goals.push({id:nid(),t:String(i.text).trim().slice(0,120),p:i.period,done:''});save();return 'added'}},
 {name:'add_schedule_item',description:'Add a schedule item. day: all, or 0-6 where 0 is Sunday. time: HH:MM in 24h.',inputSchema:{type:'object',properties:{title:{type:'string'},day:{type:'string'},time:{type:'string'}},required:['title','day','time']},execute:async i=>{if(!/^([01]\d|2[0-3]):[0-5]\d$/.test(i.time)||!(i.day==='all'||/^[0-6]$/.test(String(i.day))))throw new Error('bad day or time');S.sched.push({id:nid(),d:String(i.day),tm:i.time,t:String(i.title||'').trim().slice(0,120)});save();return 'added'}},
 {name:'set_theme',description:'Change app colors. Optional keys: pri (header and buttons), acc (XP accent), bg (page background), card (cards), ink (text). Values are CSS colors such as #22aa66.',inputSchema:{type:'object',properties:{pri:{type:'string'},acc:{type:'string'},bg:{type:'string'},card:{type:'string'},ink:{type:'string'}}},execute:async i=>{['pri','acc','bg','card','ink'].forEach(k=>{if(i[k]&&CSS.supports('color',i[k]))S.theme[k]=i[k]});save();applyTheme();return 'theme updated'}},
 {name:'reset_theme',description:'Restore the default colors.',inputSchema:{type:'object',properties:{}},execute:async()=>{S.theme={};save();applyTheme();return 'reset'}}
];
const GEM='gemini-3.8-flash';
async function callGemini(p){
  const contents=[{role:'user',parts:[{text:p}]}];
  const tools=[{functionDeclarations:TOOLS.map(t=>({name:t.name,description:t.description,parameters:Object.keys(t.inputSchema.properties||{}).length?t.inputSchema:undefined}))}];
  for(let n=0;n<5;n++){
    const res=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+GEM+':generateContent',{method:'POST',headers:{'content-type':'application/json','x-goog-api-key':S.key},body:JSON.stringify({contents,tools})});
    const j=await res.json();
    const m=(j.error&&j.error.message)||'error';
    if(!res.ok)throw {code:res.status===429?'rate':(res.status===400||res.status===403)&&/key/i.test(m)?'bad_key':'error',message:m};
    const c=j.candidates&&j.candidates[0]&&j.candidates[0].content;
    if(!c)return {text:'No answer.'};
    contents.push(c);
    const parts=c.parts||[];
    const calls=parts.filter(x=>x.functionCall);
    const text=parts.filter(x=>x.text).map(x=>x.text).join(' ');
    if(!calls.length)return {text};
    const out=[];
    for(const x of calls){const t=TOOLS.find(y=>y.name===x.functionCall.name);let r;try{r={result:await t.execute(x.functionCall.args||{})}}catch(e){r={error:String(e&&e.message||e)}}out.push({functionResponse:{name:x.functionCall.name,response:r}})}
    contents.push({role:'user',parts:out});
  }
  return {text:'Done.'};
}
async function callKey(p){
  if(!S.key.startsWith('sk-ant'))return callGemini(p);
  const msgs=[{role:'user',content:p}];
  const tools=TOOLS.map(t=>({name:t.name,description:t.description,input_schema:t.inputSchema}));
  for(let n=0;n<5;n++){
    const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':S.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-sonnet-5-5',max_tokens:1000,messages:msgs,tools})});
    const j=await res.json();
    if(!res.ok)throw {code:res.status===401?'bad_key':'error',message:(j.error&&j.error.message)||'error'};
    msgs.push({role:'assistant',content:j.content});
    const uses=j.content.filter(b=>b.type==='tool_use');
    const text=j.content.filter(b=>b.type==='text').map(b=>b.text).join(' ');
    if(!uses.length)return {text};
    const results=[];
    for(const u of uses){const t=TOOLS.find(x=>x.name===u.name);let out,err=false;try{out=await t.execute(u.input)}catch(e){out=String(e&&e.message||e);err=true}results.push({type:'tool_result',tool_use_id:u.id,content:out,is_error:err})}
    msgs.push({role:'user',content:results});
  }
  return {text:'Done.'};
}
async function ask(q){
  aiQ='';aiText='One moment...';view();
  let sample=null;
  try{sample=window.claude?await window.claude.use('sample'):null}catch(e){}
  const viaKey=!sample;if(viaKey&&!S.key){aiText='Paste your Anthropic API key in the box below to use the AI coach on this site.';view();return}
  const sc=S.sched.map(i=>(i.d==='all'?'Every day':DAYS[i.d])+' '+i.tm+' '+i.t).join('; ')||'none';
  const gl=S.goals.map(g=>NM[g.p]+': '+g.t+(isDone(g)?' (done)':'')).join('; ')||'none';
  const p='You are a friendly life coach. Reply in simple English, under 150 words, with short bullet points. You can change the app using your tools: add goals, add schedule items, and change colors. When asked, use them, then confirm in one sentence. You cannot change anything else about the app.\nToday: '+DAYS[new Date().getDay()]+'\nMy schedule: '+sc+'\nMy goals: '+gl+'\nMy level: '+(Math.floor(S.xp/100)+1)+'\n\nMy request: '+q;
  try{
    const r=viaKey?await callKey(p):await sample(p,{onText:({text})=>{aiText=text;const o=$('#aiout');if(o)o.textContent=text},tools:TOOLS,cache:false});
    aiText=r.text;
  }catch(e){aiText=e&&e.code==='not_granted'?'Please allow the AI coach to run.':e&&e.code==='bad_key'?'That API key was rejected. Check it and save it again.':e&&e.code==='rate'?'Free limit reached. Wait a minute and try again.':'Something went wrong: '+String(e&&e.message||'try again').slice(0,200)}
  const o=$('#aiout');if(o)o.textContent=aiText;render();
}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),6000)}
function notifState(){if(!('Notification' in window))return 'Browser notifications are not supported here. In-app alerts still show while this page is open.';const p=Notification.permission;return p==='granted'?'On. Alerts fire at each schedule time while this page is open.':p==='denied'?'Blocked in your browser settings. In-app alerts still show.':'Off. Tap Enable to allow alerts.'}
function fire(title,body){toast(title+(body?' — '+body:''));try{if('Notification' in window&&Notification.permission==='granted')new Notification(title,{body})}catch(e){}}
const sent=new Set();
function tick(){
  const n=new Date(),hm=pad(n.getHours())+':'+pad(n.getMinutes()),day=ymd(n);
  schedToday().forEach(i=>{const k=day+i.id+i.tm;if(i.tm===hm&&!sent.has(k)){sent.add(k);fire('⏰ '+i.t,'Scheduled for '+i.tm)}});
  if(S.remind&&S.remind===hm){const k=day+'rm';if(!sent.has(k)){sent.add(k);const left=S.goals.filter(g=>g.p==='d'&&!isDone(g)).length;if(left)fire('🎯 Daily goals',left+' still to do today')}}
}
setInterval(tick,15000);
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const d=b.dataset;
  if(d.tab){tab=d.tab;render()}
  else if(d.del){S.goals=S.goals.filter(g=>String(g.id)!==d.del);save();render()}
  else if(d.dels){S.sched=S.sched.filter(i=>String(i.id)!==d.dels);save();render()}
  else if('addg' in d){const t=$('#gt').value.trim();if(!t)return;S.goals.push({id:Date.now(),t,p:$('#gp').value,done:''});save();render()}
  else if('adds' in d){const t=$('#stt').value.trim();if(!t)return;S.sched.push({id:Date.now(),d:$('#sd').value,tm:$('#stm').value||'00:00',t});save();render()}
  else if('notif' in d){try{Promise.resolve(Notification.requestPermission()).then(()=>render())}catch(err){toast('Notifications are not supported here')}}
  else if('test' in d){fire('🔔 Test','Notifications are working')}
  else if('rm' in d){S.remind=$('#rm').value;save();toast(S.remind?'Reminder set for '+S.remind:'Reminder turned off')}
  else if('key' in d){const v=$('#ak').value.trim();if(v){S.key=v;save();toast('Key saved');render()}}
  else if('nokey' in d){S.key='';save();toast('Key removed');render()}
  else if(d.ai){ask(d.ai)}
  else if('ask' in d){const q=$('#aq').value.trim();if(q)ask(q)}
});
document.addEventListener('change',e=>{if(e.target.dataset&&e.target.dataset.t)toggle(e.target.dataset.t)});
applyTheme();
render();
</script>
</body>
</html>
